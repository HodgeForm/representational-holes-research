name: Verify release candidate

on:
  push:
    branches:
      - "release/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exp012:
    name: Reproduce Experiment 012
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Verify frozen result artifacts
        run: python experiments/exp012/verify_exp012.py

  lean:
    name: Build Lean certificate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact supplied Lean archive
        run: |
          base64 -d artifacts/orbita_language_limit_lean_v0_1.zip.b64 > /tmp/orbita_language_limit_lean_v0_1.zip
          echo "3ff0a2bf1034a34111f5060bdafe947daf46c3245f6a894d55a168b700b2409c  /tmp/orbita_language_limit_lean_v0_1.zip" | sha256sum -c -
          mkdir -p /tmp/orbita-lean
          unzip -q /tmp/orbita_language_limit_lean_v0_1.zip -d /tmp/orbita-lean

      - name: Check source contains no unfinished proof placeholders
        working-directory: /tmp/orbita-lean/orbita_language_limit_lean
        run: |
          if grep -R -n -E '(^|[[:space:]])(sorry|admit|axiom)([[:space:]]|$)' OrbitaLanguageLimit OrbitaLanguageLimit.lean; then
            echo "Found unfinished proof placeholder."
            exit 1
          fi

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned Mathlib dependencies
        working-directory: /tmp/orbita-lean/orbita_language_limit_lean
        run: |
          lake update
          lake exe cache get

      - name: Build formalization
        working-directory: /tmp/orbita-lean/orbita_language_limit_lean
        run: |
          set -o pipefail
          lake build 2>&1 | tee /tmp/lean-build.log

      - name: Write machine-check receipt
        working-directory: /tmp/orbita-lean/orbita_language_limit_lean
        run: |
          {
            echo "repository_commit=$GITHUB_SHA"
            echo "lean_archive_sha256=3ff0a2bf1034a34111f5060bdafe947daf46c3245f6a894d55a168b700b2409c"
            echo "toolchain=$(cat lean-toolchain)"
            lean --version
            lake --version
            echo "lake_build=PASS"
          } | tee /tmp/lean-proof-receipt.txt

      - uses: actions/upload-artifact@v4
        with:
          name: lean-proof-receipt
          path: |
            /tmp/lean-proof-receipt.txt
            /tmp/lean-build.log
